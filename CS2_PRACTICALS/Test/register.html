<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Create Account</title>
</head>
<body>
    <main class="main-container">

        <form action="" class="form-container" id="register" method="post">
            <div class="header"><h1>Create Account</h1></div>

            <div class="names">
                <div class="input-container">
                    <label for="fname">First name *</label>
                    <input id="fname" name="firstname" placeholder="enter your first name">
                </div>

                <div class="input-container">
                    <label for="lname">Last name *</label>
                    <input id="lname" name="lastname" placeholder="enter your last name">
                </div>
            </div>

            <div class="input-container">
                <label for="email">Email *</label>
                <input type="email" name="email" id="email" placeholder="enter your email">
            </div>

            <div class="passwords">
                <div class="input-container">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" placeholder="enter your password">
                </div>

                <div class="input-container">
                    <label for="confirm">Confirm Password *</label>
                    <input type="password" id="confirm" name="confirm" placeholder="enter your password again">
                </div>
            </div>

            <div>
                <fieldset>
                    <legend>Gender</legend>

                    <label>
                        <input type="radio" value="male" id="male" name="male">Male
                    </label>

                    <label>
                        <input type="radio" value="female" id="female" name="female">Female
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Hobbies</legend>

                    <label>
                        <input type="checkbox" value="music" id="music" name="music">Music
                    </label>

                    <label>
                        <input type="checkbox" value="sports" id="sports" name="sports">Sports
                    </label>

                    <label>
                        <input type="checkbox" value="travel" id="travel" name="travel">Travel
                    </label>

                    <label>
                        <input type="checkbox" value="movies" id="movies" name="movies">Movies
                    </label>
                </fieldset>
            </div>

            <div class="incomes">
                <div class="input-container">
                    <label for="source">Source of Income</label>
                    <select id="source" name="source">
                        <option id="employed" value="employed">Employed</option>
                        <option id="entrepreneur" value="entrepreneur">Entrepreneur</option>
                    </select>
                </div>

                <div class="input-container">
                    <label for="income">Income</label>
                    <input type="range" id="income" name="income" max="20" min="0">20K
                </div>
            </div>

            <div class="pic-age">
                <div class="input-container">
                    <label for="photo">Upload Profile Picture</label>
                    <input type="file" id="photo" name="photo">
                </div>

                <div class="input-container">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="e.g. 18">
                </div>
            </div>

            <div class="bio">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="4"></textarea>
            </div>

            <div class="footer">
                <span></span>
                <button type="submit" id="submitBtn">Create</button>
            </div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
